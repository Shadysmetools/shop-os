# Runs on every pull request and every push to main.
# Cheapest checks first: if lint fails, we don't wait for the build.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch cancels the older, now useless run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: this workflow only needs to read the code.
permissions:
  contents: read

jobs:
  checks:
    # This name is what branch protection marks as a required check.
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      # Installs the pnpm version from "packageManager" in package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      # Node version from .nvmrc; caches the pnpm store, keyed on pnpm-lock.yaml.
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Fails if pnpm-lock.yaml doesn't match package.json, instead of quietly updating it.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
