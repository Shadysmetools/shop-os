# Runs on every pull request and every push to main.
# Fails if README, CLAUDE.md or the two core ADRs are missing or incomplete.
# The full CI pipeline (lint, typecheck, tests, build) comes in T-FND-4.
name: Docs check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: node scripts/check-docs.mjs
